[tool.poetry]
name = "ai-kiosk-shared"
version = "0.1.0"
description = "Shared modules for AI Kiosk Agent Platform services"
authors = ["Pau Gaspar"]
packages = [{include = "tracing"}]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.27.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
