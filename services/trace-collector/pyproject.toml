[tool.poetry]
name = "trace-collector"
version = "0.1.0"
description = "Trace collection service for AI Kiosk Agent Platform"
authors = ["Pau Gaspar"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
structlog = "^24.1.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
