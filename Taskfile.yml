version: '3'

tasks:
  # ========== SETUP ==========
  setup:
    desc: "Complete local setup (install dependencies)"
    cmds:
      - echo "📦 Installing JavaScript dependencies..."
      - pnpm install
      - echo "🐍 Installing Python dependencies..."
      - poetry install
      - echo "📋 Copying example env files..."
      - cp .env.dev.example .env || true
      - cp apps/ui-kiosk/.env.example apps/ui-kiosk/.env || true
      - cp services/orchestrator/.env.example services/orchestrator/.env || true
      - cp services/mcp-tools/.env.example services/mcp-tools/.env || true
      - echo ""
      - echo "✅ Complete local setup finished!"
      - echo ""
      - echo "⚠️  IMPORTANT — Next step:"
      - echo "   Edit services/orchestrator/.env and configure your LLM API key:"
      - echo "   GEMINI_API_KEY=your_key  (free at https://aistudio.google.com)"
      - echo ""
      - echo "   Then run: task dev:services  (and in another terminal: task dev:ui)"

  verify:
    desc: "Verify that the environment is correctly configured"
    cmds:
      - echo "🔍 Verifying prerequisites..."
      - node -v | grep -q "v2[0-9]" && echo "✅ Node.js OK" || echo "❌ Node.js 20+ required"
      - pnpm -v | grep -qE "^[89]\." && echo "✅ pnpm OK" || echo "❌ pnpm 8+ required"
      - python3 -V | grep -qE "3\.1[1-9]" && echo "✅ Python OK" || echo "❌ Python 3.11+ required"
      - docker -v > /dev/null && echo "✅ Docker OK" || echo "❌ Docker required"
      - echo ""
      - echo "🔍 Verifying .env files..."
      - test -f .env && echo "✅ .env exists" || echo "❌ Missing .env — run 'task setup'"
      - test -f apps/ui-kiosk/.env && echo "✅ apps/ui-kiosk/.env exists" || echo "❌ Missing apps/ui-kiosk/.env"
      - test -f services/orchestrator/.env && echo "✅ services/orchestrator/.env exists" || echo "❌ Missing services/orchestrator/.env"
      - echo ""
      - echo "🔍 Verifying LLM API key..."
      - grep -qE "^GEMINI_API_KEY=.+" services/orchestrator/.env && echo "✅ GEMINI_API_KEY configured" || grep -qE "^GROK_API_KEY=.+" services/orchestrator/.env && echo "✅ GROK_API_KEY configured" || echo "⚠️  No LLM API key configured in services/orchestrator/.env"

  # ========== DEVELOPMENT ==========
  dev:services:
    desc: "Start backend services with Docker"
    cmds:
      - echo "🚀 Starting backend services (Redis + PostgreSQL + Orchestrator)..."
      - docker compose -f infra/docker-compose.dev.yml up -d
      - echo "✅ Backend services started. Orchestrator at http://localhost:8765"

  dev:ui:
    desc: "Start Svelte kiosk UI"
    dir: apps/ui-kiosk
    cmds:
      - pnpm dev

  dev:
    desc: "Start everything (backend + UI)"
    cmds:
      - task: dev:services
      - echo "⏳ Waiting for backend services..."
      - sleep 3
      - echo "🎨 Starting UI..."
      - task: dev:ui

  dev:local:
    desc: "Start services locally (without Docker)"
    cmds:
      - ./scripts/run_all_local.sh

  dev:local:stop:
    desc: "Stop local services"
    cmds:
      - ./scripts/run_all_local.sh --stop

  dev:local:status:
    desc: "View local services status"
    cmds:
      - ./scripts/run_all_local.sh --status

  # ========== TESTING ==========
  test:
    desc: "Run all tests"
    cmds:
      - task: test:types
      - task: test:svelte
      - task: test:py

  test:types:
    desc: "Build shared types"
    dir: packages/shared-types
    cmds:
      - pnpm build

  test:svelte:
    desc: "Svelte tests"
    dir: apps/ui-kiosk
    cmds:
      - pnpm test

  test:py:
    desc: "Python tests (all)"
    cmds:
      - cd services/orchestrator && poetry run pytest ../../tests/ -v --cov || echo "⚠️  Error in tests"

  test:unit:
    desc: "Unit tests (fast, no services required)"
    cmds:
      - cd services/orchestrator && poetry run pytest ../../tests/unit/ -v

  test:integration:
    desc: "Integration tests (requires Docker services)"
    cmds:
      - cd services/orchestrator && poetry run pytest ../../tests/integration/ -v -m integration

  test:e2e:
    desc: "E2E tests (requires everything running)"
    cmds:
      - cd services/orchestrator && poetry run pytest ../../tests/e2e/ -v -m e2e

  test:cov:
    desc: "Tests with coverage report"
    cmds:
      - cd services/orchestrator && poetry run pytest ../../tests/ -v --cov --cov-report=term-missing --cov-report=html

  test:cov-check:
    desc: "Verify minimum coverage (80%)"
    cmds:
      - cd services/orchestrator && poetry run pytest ../../tests/ --cov --cov-fail-under=80

  # ========== BUILD ==========
  build:ui:
    desc: "Build UI for production"
    dir: apps/ui-kiosk
    cmds:
      - pnpm build
      - echo "📦 Bundle size:"
      - du -sh build/

  build:pi:
    desc: "Build UI for Raspberry Pi (ARM64)"
    cmds:
      - task: build:ui
      - echo "✅ Build ready for Pi"

  # ========== UTILS ==========
  logs:
    desc: "View backend service logs (use SERVICE=orchestrator)"
    cmds:
      - docker compose -f infra/docker-compose.dev.yml logs -f {{.SERVICE | default "orchestrator"}}

  stop:
    desc: "Stop backend services"
    cmds:
      - docker compose -f infra/docker-compose.dev.yml down
      - echo "✅ Backend services stopped"

  clean:
    desc: "Clean artifacts and containers"
    cmds:
      - docker compose -f infra/docker-compose.dev.yml down -v
      - rm -rf node_modules apps/*/node_modules packages/*/node_modules
      - find . -name "__pycache__" -exec rm -rf {} + || true
      - find . -name "*.pyc" -delete || true
      - echo "✅ Cleanup complete"

  healthcheck:
    desc: "Check backend service health"
    cmds:
      - echo "🏥 Checking services..."
      - curl -s http://localhost:8765/healthz | jq . || echo "❌ Orchestrator not responding"
      - docker exec ai-kiosk-redis-dev redis-cli ping || echo "❌ Redis not responding"
      - docker exec ai-kiosk-postgres-dev pg_isready -U kiosk || echo "❌ PostgreSQL not responding"

  # ========== KIOSK MODE ==========
  kiosk:
    desc: "Launch AI Kiosk in kiosk mode (full screen)"
    cmds:
      - ./scripts/launch-kiosk.sh

  kiosk:only:
    desc: "Open kiosk mode only (services must already be running)"
    cmds:
      - ./scripts/launch-kiosk.sh

  # ========== TRACING ==========
  trace:collector:
    desc: "Start the Trace Collector service"
    dir: services/trace-collector
    cmds:
      - poetry run python src/collector/main.py

  trace:analyze:
    desc: "Analyze a trace (TRACE_ID required)"
    cmds:
      - python scripts/analyze_trace.py {{.TRACE_ID | default ""}}

  trace:list:
    desc: "List available traces"
    cmds:
      - python scripts/analyze_trace.py --list

  trace:golden:
    desc: "List available golden flows"
    cmds:
      - python scripts/analyze_trace.py --list-flows

  trace:validate:
    desc: "Validate a trace against a golden flow (FLOW and TRACE_ID required)"
    cmds:
      - python scripts/analyze_trace.py --golden-flow {{.FLOW}} {{.TRACE_ID | default ""}}

  trace:viewer:
    desc: "Start the Trace Viewer web app (port 9003)"
    dir: apps/trace-viewer
    cmds:
      - pnpm install --ignore-scripts || true
      - pnpm dev

  trace:viewer:build:
    desc: "Build Trace Viewer for production"
    dir: apps/trace-viewer
    cmds:
      - pnpm install --ignore-scripts || true
      - pnpm build

  trace:full:
    desc: "Start Trace Collector + Trace Viewer (both in parallel)"
    cmds:
      - echo "🚀 Starting Trace Collector (9002) and Trace Viewer (9003)..."
      - |
        (cd services/trace-collector && poetry run python src/collector/main.py) &
        COLLECTOR_PID=$!
        sleep 2
        (cd apps/trace-viewer && pnpm install --ignore-scripts && pnpm dev) &
        VIEWER_PID=$!
        echo "✅ Services started:"
        echo "   Trace Collector: http://localhost:9002"
        echo "   Trace Viewer:    http://localhost:9003"
        echo ""
        echo "Press Ctrl+C to stop both services"
        trap "kill $COLLECTOR_PID $VIEWER_PID 2>/dev/null" EXIT
        wait
